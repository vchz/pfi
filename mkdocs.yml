site_name: pfi
site_description: Documentation for the package PFI (Probability Flow Inference).
site_author: Victor Chardes & Suryanarayana Maddu
repo_url: https://github.com/vchz/pfi/
repo_name: vchz/pfi

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.integrate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

edit_uri: blob/main/

extra_css:
  - style/custom_style.css

exclude_docs: |
  gen_api_docs.py
  tests/

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_api_docs.py
  - literate-nav:
      nav_file: SUMMARY.md
      implicit_index: true
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            docstring_section_style: list
            inherited_members: true
            show_root_heading: true
            show_root_full_path: false
            show_signature: true
            show_source: false
            heading_level: 2
            show_symbol_type_toc: true
            show_symbol_type_heading: true
            merge_init_into_class: true
            type_parameter_headings: true
            filters:
              - "^__init__$"
              - "!^__.*__$"
              - "!^_.*"
              - "!forward"

nav:
  - Getting started: index.md
  - Documentation: api/
  
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences